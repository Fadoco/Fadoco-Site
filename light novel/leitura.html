<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendo Capítulo | Star Hub</title>    
    <link rel="stylesheet" href="light-novel.css">
    <!-- As fontes agora são importadas diretamente em light-novel.css -->
</head>
<body>
    <div id="hyperspace" class="hyperspace-overlay">
        <div class="loading-content">
            <!-- O caminho do vídeo será ajustado pelo script-transição.js -->
            <video src="../img/personagem%20de%20carregamento.mp4" autoplay loop muted playsinline class="loading-video"></video>
            <div class="loading-text">Abrindo Transmissão</div>
            <div class="dots-container"><span class="dots"></span></div>
        </div>
    </div>

    <header class="header-personagem">
        <a href="personagem.html" class="btn-voltar">← VOLTAR</a>
        <h1 id="cap-titulo" class="capitulo-titulo-exibido">Carregando...</h1>
    </header>

    <main class="container-leitura reveal-section">
        <div class="leitor-container" id="conteudo-capitulo">
            <!-- Texto injetado aqui -->
        </div>
        <div class="btn-navegacao reveal-section">
            <a href="personagem.html" class="btn-voltar">CONCLUIR TRANSMISSÃO</a>
        </div>
    </main>

    <script src="../script-transição.js"></script>
    <script src="../script.js"></script>
    <script src="leitura.js"></script>
</body>

    <!-- Containers para o funcionamento do Lightbox -->
    <div id="overlay" class="overlay">
        <span class="close-overlay" onclick="fecharAmpliacao()" data-tooltip="Fechar">&times;</span>
        <div id="conteudo-expandido"></div>
    </div>

    <button id="back-to-top" data-tooltip="Órbita Inicial">▲</button>

</html>
