<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendo Capítulo | Star Hub</title>    
    <link rel="stylesheet" href="../css/light-novel.css">
    <!-- As fontes agora são importadas diretamente em light-novel.css -->
</head>
<body class="leitura-page">
    <div id="hyperspace" class="hyperspace-overlay">
        <video class="loading-video" autoplay loop muted playsinline style="background: #000;">
            <source src="../img/personagem%25de%25carregamento.mp4" type="video/mp4">
        </video>
        <div class="loading-content">
            <div class="loading-text">Sintonizando com o universo</div>
            <div class="dots-container"><span class="dots"></span></div>
        </div>
    </div>

    <!-- Barra de Progresso de Leitura -->
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

    <header class="header-personagem">
        <a href="personagem.html" class="btn-voltar">← VOLTAR</a>
        <h1 id="cap-titulo" class="capitulo-titulo-exibido">Carregando...</h1>
        
        <div class="menu-extra">
            <button id="btn-menu" class="btn-menu" data-tooltip="Abrir Terminal de Navegação">INDEX</button>
        </div>
    </header>

    <nav id="side-menu" class="side-menu">
        <span id="btn-fechar" class="btn-fechar">&times;</span>
        <ul>
            <li><a href="../index.html">INÍCIO</a></li>
            <li><a href="personagem.html">LIGHT NOVEL</a></li>
            <li><a href="../lore.html">LORE</a></li>
            <li><a href="../artes.html">ARTES</a></li>
            <li><a href="../gostos.html">GOSTOS</a></li>
            <li><a href="../redes_sociais.html">CONTATO</a></li>
        </ul>
    </nav>

    <main class="container-leitura">
        <div class="conteudo-capitulo reveal-section" id="conteudo-capitulo">
            <!-- Texto injetado aqui -->
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>© <span id="year"></span> STAR HUB - Registro Galáctico</p>
        </div>
    </footer>

    <script src="../js/script-favoritos.js" defer></script>
    <script src="../js/script-transição.js" defer></script>
    <script src="../js/script.js" defer></script>
    <script src="leitura.js" defer></script>

    <!-- Containers para o funcionamento do Lightbox -->
    <div id="overlay" class="overlay">
        <span class="close-overlay" onclick="fecharAmpliacao()" data-tooltip="Fechar">&times;</span>
        <div id="conteudo-expandido"></div>
    </div>

    <div id="favorites-overlay" class="fav-overlay">
        <div id="favorites-grid" class="fav-content"></div>
    </div>

    <button id="back-to-top" data-tooltip="Órbita Inicial">▲</button>
</body>
</html>
