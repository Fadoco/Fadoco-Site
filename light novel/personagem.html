<!DOCTYPE html>
<html lang="pt-br">
<head class="personagem-page">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Novel | Star Hub</title>
    <link rel="stylesheet" href="light-novel.css"> 
    <!-- As fontes agora são importadas diretamente em light-novel.css -->
</head>
<body>
    <div id="hyperspace" class="hyperspace-overlay">
        <video class="loading-video" autoplay loop muted playsinline style="background: #000;">
            <source src="personagem de carregamento.mp4" type="video/mp4">
        </video>
        <div class="loading-content">
            <p class="loading-text">Sintonizando com o universo</p> 
            <div class="dots-container"><span class="dots"></span></div>
        </div>
    </div>

    <header class="header-personagem">
        <a href="../index.html" class="btn-voltar">← VOLTAR AO HUB</a>
        <h1>LIGHT NOVEL</h1>
    </header>

    <main class="container-personagem">
        <section class="perfil-topo">
            <div class="foto-container">
                <img src="../img/Logo.jpg" alt="Personagem" class="foto-principal">
                <div class="frame-neon"></div>
            </div>
            
            <div class="info-rapida">
                <div class="status-item"><span>REGISTRO DE CLASSE:</span> <p>Guardião da Criação</p></div>
                <div class="status-item"><span>COORDENADA DE ORIGEM:</span> <p>Desconhecida</p></div>
                <div class="status-item"><span>SINAL VITAL:</span> <p style="color: #00ff00;">● ONLINE</p></div>
            </div>
        </section>

        <section class="historia-sessao" style="width: 100%;">
            <h2 class="subtitulo-estelar" style="text-align: center; margin-bottom: 40px; font-size: 1rem;">Banco de Dados de Capítulos</h2>
            
            <!-- Container para o botão de retomar leitura -->
            <div id="resume-container" style="display: flex; justify-content: center; margin-bottom: 30px;"></div>
            
            <nav class="capitulos-nav" id="capitulos-menu">
                <!-- Botões dos capítulos serão gerados aqui -->
            </nav>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>© <span id="year"></span> STAR HUB - Registro Galáctico</p>
            <p style="font-size: 0.6rem; margin-top: 10px; opacity: 0.5;">SINAL TRANSMITIDO VIA DEEP SPACE NETWORK</p>
        </div>
    </footer>

    <script src="../script-transição.js"></script>
    <script src="personagem.js"></script>
</body>

    <!-- Containers para o funcionamento do Lightbox -->
    <div id="overlay" class="overlay">
        <span class="close-overlay" onclick="fecharAmpliacao()" data-tooltip="Fechar">&times;</span>
        <div id="conteudo-expandido"></div>
    </div>

    <button id="back-to-top" data-tooltip="Órbita Inicial">▲</button>

</html>
